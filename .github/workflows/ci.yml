name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          else
            echo "android/ already exists in the repo -- skipping regeneration so committed native code isn't overwritten."
          fi

      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Patch Android Gradle config
        run: |
          sed -E -i \
            -e 's/(id "org\.jetbrains\.kotlin\.android" version )"[^"]+"/\1"1.9.24"/' \
            -e 's/(id "com\.android\.application" version )"[^"]+"/\1"8.6.0"/' \
            android/settings.gradle
          sed -E -i \
            -e 's/compileSdk(Version)? *=? *flutter\.compileSdkVersion/compileSdk = 35/' \
            android/app/build.gradle

      - name: Patch Gradle wrapper version
        run: |
          GRADLE_WRAPPER_FILE="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_WRAPPER_FILE" ]; then
            sed -E -i \
              -e 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' \
              "$GRADLE_WRAPPER_FILE"
          else
            echo "Warning: $GRADLE_WRAPPER_FILE not found, skipping patch"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulimit-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
