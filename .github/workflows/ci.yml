name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Ensure Android platform files
        run: flutter create --platforms=android .

      - name: Remove default widget test
        run: rm -f test/widget_test.dart

      - name: Patch Android Gradle config
        run: |
          sed -E -i \
            -e 's/(id "org\.jetbrains\.kotlin\.android" version )"[^"]+"/\1"1.9.24"/' \
            -e 's/(id "com\.android\.application" version )"[^"]+"/\1"8.6.0"/' \
            android/settings.gradle
          sed -E -i \
            -e 's/compileSdk(Version)? *=? *flutter\.compileSdkVersion/compileSdk = 35/' \
            android/app/build.gradle

      - name: Patch Gradle wrapper version
        run: |
          sed -E -i \
            -e 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulimit-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
